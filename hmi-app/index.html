<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <!-- Static dark fallback — parsed before any JS, guarantees no white flash on load -->
  <style>
    html, body, #root, canvas {
      background-color: var(--color-industrial-bg, #05070a);
    }

    body {
      margin: 0;
    }

    #hmi-shield {
      --hmi-shield-ink: currentColor;
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-color: var(--color-industrial-bg, #05070a);
      color: #cfd6df;
      font-family: Consolas, monospace;
      font-size: 0.875rem;
      line-height: 1.5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 1;
      visibility: visible;
      pointer-events: none;
      transition: opacity 0.18s ease-out, visibility 0.18s ease-out;
    }

    #hmi-shield [data-hmi-shield-shell] {
      display: inline-flex;
      flex-direction: column;
      gap: 0;
      width: min(18ch, 100%);
      align-items: center;
      justify-content: center;
    }

    #hmi-shield [data-hmi-shield-typewriter] {
      position: relative;
      display: block;
      width: 18ch;
      max-width: 100%;
      overflow: visible;
      text-align: left;
      letter-spacing: 0;
      white-space: nowrap;
    }

    #hmi-shield [data-hmi-shield-typed] {
      display: inline-block;
      overflow: hidden;
      width: 0;
      vertical-align: bottom;
      text-align: left;
      letter-spacing: 0;
      white-space: nowrap;
      animation: typing 0.8s steps(1) 0.6s forwards;
    }

    #hmi-shield [data-hmi-shield-caret] {
      position: absolute;
      bottom: 0;
      left: 0;
      color: var(--hmi-shield-ink);
      text-align: left;
      letter-spacing: 0;
      animation: caret-idle 0.6s steps(1) 0s 1,
        caret-move 0.8s steps(1) 0.6s forwards,
        caret-blink 0.6s steps(1) 1.4s 1 forwards;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] {
      position: relative;
      display: inline-block;
      width: 10ch;
      height: 1.2em;
      font: inherit;
      letter-spacing: 0.05em;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail] {
      position: absolute;
      inset: 0 auto auto 0;
      white-space: pre;
      color: var(--color-industrial-bg, #05070a);
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail]::before {
      content: "_         ";
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="head"] {
      --hmi-shield-trail-color: #f0f0f0;
      animation: trail-show 0.1s step-start 1.7s forwards;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="head"]::before {
      animation: walk 1.8s steps(1) 1.7s infinite;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g1"] {
      --hmi-shield-trail-color: #898989;
      animation: trail-show 0.1s step-start 1.8s forwards;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g1"]::before {
      animation: walk 1.8s steps(1) 1.8s infinite;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g2"] {
      --hmi-shield-trail-color: #5b5b5b;
      animation: trail-show 0.1s step-start 1.9s forwards;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g2"]::before {
      animation: walk 1.8s steps(1) 1.9s infinite;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g3"] {
      --hmi-shield-trail-color: #3d3d3d;
      animation: trail-show 0.1s step-start 2s forwards;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g3"]::before {
      animation: walk 1.8s steps(1) 2s infinite;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g4"] {
      --hmi-shield-trail-color: #282828;
      animation: trail-show 0.1s step-start 2.1s forwards;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g4"]::before {
      animation: walk 1.8s steps(1) 2.1s infinite;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g5"] {
      --hmi-shield-trail-color: #1a1a1a;
      animation: trail-show 0.1s step-start 2.2s forwards;
    }

    #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="g5"]::before {
      animation: walk 1.8s steps(1) 2.2s infinite;
    }

    @keyframes typing {
      0% { width: 0; }
      7% { width: 1ch; }
      11% { width: 2ch; }
      15% { width: 3ch; }
      19% { width: 4ch; }
      23% { width: 5ch; }
      27% { width: 6ch; }
      32% { width: 7ch; }
      40% { width: 8ch; }
      45% { width: 9ch; }
      50% { width: 10ch; }
      55% { width: 11ch; }
      60% { width: 12ch; }
      72% { width: 13ch; }
      80% { width: 14ch; }
      85% { width: 15ch; }
      90% { width: 16ch; }
      95% { width: 17ch; }
      100% { width: 18ch; }
    }

    @keyframes caret-move {
      0% { left: 0; }
      7% { left: 1ch; }
      11% { left: 2ch; }
      15% { left: 3ch; }
      19% { left: 4ch; }
      23% { left: 5ch; }
      27% { left: 6ch; }
      32% { left: 7ch; }
      40% { left: 8ch; }
      45% { left: 9ch; }
      50% { left: 10ch; }
      55% { left: 11ch; }
      60% { left: 12ch; }
      72% { left: 13ch; }
      80% { left: 14ch; }
      85% { left: 15ch; }
      90% { left: 16ch; }
      95% { left: 17ch; }
      100% { left: 18ch; }
    }

    @keyframes caret-blink {
      0%, 49% { color: var(--hmi-shield-ink); }
      50%, 100% { color: var(--color-industrial-bg, #05070a); }
    }

    @keyframes caret-idle {
      0%, 49% { color: var(--hmi-shield-ink); }
      50%, 100% { color: var(--color-industrial-bg, #05070a); }
    }

    @keyframes walk {
      0% { content: "_         "; }
      5.556% { content: " _        "; }
      11.111% { content: "  _       "; }
      16.667% { content: "   _      "; }
      22.222% { content: "    _     "; }
      27.778% { content: "     _    "; }
      33.333% { content: "      _   "; }
      38.889% { content: "       _  "; }
      44.444% { content: "        _ "; }
      50% { content: "         _"; }
      55.556% { content: "        _ "; }
      61.111% { content: "       _  "; }
      66.667% { content: "      _   "; }
      72.222% { content: "     _    "; }
      77.778% { content: "    _     "; }
      83.333% { content: "   _      "; }
      88.889% { content: "  _       "; }
      94.444% { content: " _        "; }
    }

    @keyframes trail-show {
      to { color: var(--hmi-shield-trail-color); }
    }

    @media (prefers-reduced-motion: reduce) {
      #hmi-shield,
      #hmi-shield [data-hmi-shield-typed],
      #hmi-shield [data-hmi-shield-caret],
      #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail]::before {
        animation: none !important;
        transition: none;
      }

      #hmi-shield [data-hmi-shield-typed] {
        width: 18ch;
      }

      #hmi-shield [data-hmi-shield-caret] {
        left: 18ch;
        color: var(--hmi-shield-ink);
      }

      #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail] {
        color: var(--color-industrial-bg, #05070a);
      }

      #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="head"] {
        color: #f0f0f0;
      }

      #hmi-shield [data-hmi-shield-cursor-loader] [data-hmi-shield-trail="head"]::before {
        content: "         _";
      }
    }

    #hmi-shield[data-hmi-shield-state="hidden"],
    #hmi-shield.hmi-shield--hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
  <!-- Define --color-industrial-bg early (persisted or default) so any var() ref resolves immediately -->
  <script>
    (function(){try{var c=JSON.parse(localStorage.getItem('hmi-theme-colors')||'{}');var bg=c['--color-industrial-bg']||'#05070a';var s=document.documentElement.style;s.setProperty('--color-industrial-bg',bg);s.backgroundColor=bg}catch(e){}})();
  </script>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <title>Interfaz Laboratorio</title>
</head>

  <body>
  <!-- Gradient definitions for SVG icons -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden;">
    <defs>
      <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#A78BFA" />
        <stop offset="100%" stop-color="#22d3ee" />
      </linearGradient>
    </defs>
  </svg>

  <div id="hmi-shield" data-hmi-shield-state="visible" role="status" aria-live="polite">
    <div data-hmi-shield-shell>
      <span data-hmi-shield-typewriter>
        <span data-hmi-shield-typed>ACTUALIZANDO DATOS</span><span data-hmi-shield-caret aria-hidden="true">_</span>
      </span>
      <div data-hmi-shield-cursor-loader>
        <span data-hmi-shield-trail="g5" aria-hidden="true"></span>
        <span data-hmi-shield-trail="g4" aria-hidden="true"></span>
        <span data-hmi-shield-trail="g3" aria-hidden="true"></span>
        <span data-hmi-shield-trail="g2" aria-hidden="true"></span>
        <span data-hmi-shield-trail="g1" aria-hidden="true"></span>
        <span data-hmi-shield-trail="head" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
